name: bisindo_app
description: "Aplikasi Android untuk belajar Bahasa Isyarat Indonesia (BISINDO)."
publish_to: 'none'

version: 0.1.0+1

environment:
  # Flutter stable 3.47.x (Dart 3.12+). go_router 18 & flutter_riverpod 3.4 mensyaratkan Dart ^3.12.
  sdk: ^3.12.0
  flutter: ">=3.47.0"   # go_router 18 → material_ui 1.x butuh Flutter ≥ 3.47

# Versi dipilih dari rilis stabil terbaru yang terlihat di tag GitHub resmi
# masing-masing paket per 2026-10-20 (pub.dev tidak dapat diakses dari
# lingkungan pembuatan). BELUM TERVERIFIKASI dengan `flutter pub get`.
dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.18.3   # 3.0.0 masih -dev → tidak dipakai
  flutter_riverpod: ^3.4.3    # tanpa codegen (D-01)
  go_router: ^18.1.0          # D-02
  flutter_svg: ^2.3.0         # logo vektor (menunggu aset K-01)
  intl: ^0.20.2               # format tanggal Indonesia

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  # Font dibundel (D-15). Inter 4.1 — SIL OFL 1.1 (assets/fonts/OFL.txt).
  # Keluarga font final menunggu K-04.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800

# Native splash (AUTH spec §5.1). Generator BELUM dijalankan; jalankan:
#   dart run flutter_native_splash:create
# Logo putih ditambahkan setelah aset resmi tersedia (K-01).
flutter_native_splash:
  color: "#1C45B9"
  android_12:
    color: "#1C45B9"
  ios: false
  web: false
