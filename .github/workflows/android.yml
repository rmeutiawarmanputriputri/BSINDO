# Build APK RELEASE BISINDO otomatis di GitHub (tanpa Flutter/Android Studio di komputer Anda).
#
# Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_ANON_KEY   — WAJIB (anon/publishable key saja; JANGAN service_role)
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD — opsional tetapi DISARANKAN (keystore release, lihat docs/BUILD_APK.md).
#     Tanpa keystore, APK ditandatangani debug key acak milik server GitHub → hanya untuk UJI:
#     setiap build baru harus uninstall dulu sebelum dipasang.
#
# Hasil: tab Actions → run terbaru → bagian "Artifacts" → bisindo-apk (zip berisi APK).
name: Android APK

on:
  push:
    branches: ["main", "release/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true

      - name: Lengkapi berkas platform yang hilang (gradle wrapper, dll.)
        run: |
          flutter create . --project-name bisindo_app --org com.example --platforms android
          rm -rf android/app/src/main/kotlin/com/example/bisindo_app
          git status --short

      - name: Konfigurasi env/dev.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Secret SUPABASE_URL / SUPABASE_ANON_KEY belum diisi. APK tidak akan bisa terhubung ke database."
            exit 1
          fi
          printf '{"SUPABASE_URL":"%s","SUPABASE_ANON_KEY":"%s"}\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > env/dev.json

      - name: Keystore release (bila tersedia)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bisindo-release.jks"
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" "${KEY_ALIAS:-bisindo}" "$RUNNER_TEMP/bisindo-release.jks" > android/key.properties
            echo "SIGNING=release" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 belum diisi — APK ditandatangani debug key (khusus uji)."
            echo "BISINDO_ALLOW_DEBUG_SIGNING=true" >> "$GITHUB_ENV"
            echo "SIGNING=debug-uji" >> "$GITHUB_ENV"
          fi

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test || echo "::warning::Format belum rapi — jalankan 'dart format lib test'"
      - run: flutter analyze --no-fatal-infos
      - name: flutter test
        # Hasil tes tetap terlihat (✗ merah) tetapi tidak menahan pembuatan APK uji.
        continue-on-error: true
        run: flutter test --exclude-tags golden
      - run: flutter build apk --release --dart-define-from-file=env/dev.json

      - name: Ganti nama APK
        run: |
          V=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/BISINDO-${V}-${SIGNING}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: bisindo-apk
          path: dist/*.apk
          retention-days: 30
